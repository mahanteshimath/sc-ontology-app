<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="#29b5e8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <title>Supply chain ontology</title>
  <!--
    The colour is hard-coded here, unlike the in-app mark in components/brand-mark.tsx.
    A favicon has no surrounding document to inherit from, so `currentColor` would resolve to black
    and disappear against a dark browser tab strip. Brand cyan is legible on both light and dark
    chrome, so one fixed value serves every browser.
  -->
  <!-- central conformed node -->
  <circle cx="16" cy="16" r="3.2" fill="#29b5e8" stroke="none" />
  <!-- four satellite entities: supplier, plant, shipment, customer -->
  <circle cx="16" cy="4.6" r="2.4" />
  <circle cx="27.4" cy="16" r="2.4" />
  <circle cx="16" cy="27.4" r="2.4" />
  <circle cx="4.6" cy="16" r="2.4" />
  <!-- declared relationships -->
  <path d="M16 7v5.8M19.2 16h5.8M16 19.2V25M7 16h5.8" />
  <!-- hierarchy edges -->
  <path d="M18.3 6.9 25.5 14.1M25.5 17.9 18.3 25.1M13.7 25.1 6.5 17.9M6.5 14.1 13.7 6.9" opacity="0.45" />
</svg>
